<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RideNow | Contact Us</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',Tahoma,sans-serif;
  background:#f4f6f8;
  color:#333;
}

/* ========== NAVBAR ========== */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#fff;
  padding:22px 50px;
  min-height:80px;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
  animation:slideDown .7s ease;
}
@keyframes slideDown{
  from{transform:translateY(-100%);opacity:0}
  to{transform:translateY(0);opacity:1}
}
.logo{
  font-size:1.9em;
  font-weight:800;
  color:#2563eb;
}
nav a{
  margin-left:28px;
  color:#555;
  text-decoration:none;
  font-weight:600;
  position:relative;
}
nav a::after{
  content:'';
  position:absolute;
  width:0;height:3px;
  background:#2563eb;
  left:0;bottom:-6px;
  transition:.3s;
}
nav a:hover{color:#2563eb}
nav a:hover::after{width:100%}

/* ========== CONTACT SECTION ========== */
.contact-section{
  min-height:calc(100vh - 90px);
  display:flex;
  align-items:center;
  justify-content:center;
}

.contact-card{
  background:#fff;
  width:100%;
  max-width:500px;
  padding:40px;
  border-radius:18px;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
  animation:fadeUp .9s ease;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:translateY(0)}
}

.contact-card h2{
  color:#2563eb;
  font-weight:800;
  margin-bottom:10px;
}
.contact-card p{
  color:#666;
  margin-bottom:25px;
}

.form-control{
  border-radius:10px;
  padding:12px;
}
.form-control:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 .2rem rgba(37,99,235,.25);
}

.btn-send{
  background:#2563eb;
  color:#fff;
  border-radius:10px;
  font-weight:600;
  padding:12px;
  transition:.3s;
}
.btn-send:hover{
  background:#1e4fd8;
  transform:translateY(-2px);
  box-shadow:0 10px 20px rgba(37,99,235,.4);
}

/* Success Message */
#msg{
  color:green;
  font-weight:600;
  margin-top:15px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo">🚘 RideNow</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="rider.html">Book Ride</a>
    <a href="driver.html">Driver</a>
    
  </nav>
</header>

<!-- CONTACT -->
<section class="contact-section">
  <div class="contact-card text-center">

    <h2>Contact Us</h2>
    <p>We’d love to hear from you. Send us a message!</p>

    <form action="ContactServlet" method="post">

      <div class="mb-3 text-start">
        <label class="form-label fw-semibold">Full Name</label>
        <input type="text" name="name" class="form-control" placeholder="Enter your name" required>
      </div>

      <div class="mb-3 text-start">
        <label class="form-label fw-semibold">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
      </div>

      <div class="mb-3 text-start">
        <label class="form-label fw-semibold">Message</label>
        <textarea name="message" rows="4" class="form-control" placeholder="Type your message..." required></textarea>
      </div>

      <button type="submit" class="btn btn-send w-100">
        📩 Send Message
      </button>
    </form>

    <p id="msg"></p>

  </div>
</section>

<script>
  const params = new URLSearchParams(window.location.search);
  if (params.get("msg") === "success") {
    document.getElementById("msg").innerText =
      "Message sent successfully! We will get back to you soon.";
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
