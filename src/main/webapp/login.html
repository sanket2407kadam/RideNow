<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RideNow | Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Segoe UI',Tahoma,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#2563eb,#1e40af);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#333;
}

/* Card */
.login-card{
  background:#fff;
  width:100%;
  max-width:400px;
  padding:40px;
  border-radius:18px;
  box-shadow:0 20px 40px rgba(0,0,0,.25);
  animation:slideUp .9s ease;
}

/* Animation */
@keyframes slideUp{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:translateY(0)}
}

.logo{
  font-size:1.9em;
  font-weight:800;
  color:#2563eb;
  margin-bottom:5px;
}

.subtitle{
  font-size:.95em;
  color:#666;
  margin-bottom:25px;
}

/* Inputs */
.form-control{
  border-radius:10px;
  padding:12px;
}
.form-control:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 .2rem rgba(37,99,235,.25);
}

/* Button */
.btn-login{
  background:#2563eb;
  color:#fff;
  border-radius:10px;
  font-weight:600;
  padding:12px;
  transition:.3s;
}
.btn-login:hover{
  background:#1e4fd8;
  transform:translateY(-2px);
  box-shadow:0 10px 20px rgba(37,99,235,.4);
}

/* Links */
.extra-links a{
  color:#2563eb;
  font-weight:600;
  text-decoration:none;
}
.extra-links a:hover{text-decoration:underline}

/* Error */
.error-msg{
  color:#dc2626;
  background:#fee2e2;
  padding:8px;
  border-radius:8px;
  margin-bottom:15px;
  font-size:.9em;
  display:none;
}
</style>
</head>

<body>

<div class="login-card text-center">

  <div class="logo">🚘 RideNow</div>
  <div class="subtitle">Login to continue your ride</div>

  <div id="errorBox" class="error-msg">
    Invalid Email or Password
  </div>

  <form action="LoginServlet" method="post">
    <div class="mb-3 text-start">
      <label class="form-label fw-semibold">Email</label>
      <input type="email" name="email" class="form-control" placeholder="Enter email" required>
    </div>

    <div class="mb-3 text-start">
      <label class="form-label fw-semibold">Password</label>
      <input type="password" name="password" class="form-control" placeholder="Enter password" required>
    </div>

    <button type="submit" class="btn btn-login w-100">Login</button>
  </form>

  <div class="extra-links mt-4">
    <p class="mb-1">Don't have an account? <a href="register.html">Register</a></p>
    <p class="mb-0"><a href="forgot-password.html">Forgot Password?</a></p>
  </div>

</div>

<script>
  const params=new URLSearchParams(window.location.search);
  if(params.get("error")==="1"){
    document.getElementById("errorBox").style.display="block";
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
