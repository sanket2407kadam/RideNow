<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RideNow | Track Ride</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f4f6f8;
    color: #333;
}
.container {
    margin-top: 80px;
    max-width: 500px;
    background: #fff;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 20px 40px rgba(0,0,0,.1);
}
h2 {
    color: #2563eb;
    font-weight: 800;
    text-align: center;
    margin-bottom: 20px;
}
label {
    font-weight: 600;
}
.btn-primary {
    background: #2563eb;
    border: none;
    transition: 0.3s;
}
.btn-primary:hover {
    background: #1e4fd8;
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(37,99,235,.4);
}
</style>
</head>
<body>

<div class="container">
    <h2>Track Your Ride</h2>
    <p class="text-center">Enter your Ride ID to see current status and details.</p>
    
    <form action="track-ride" method="get">
        <div class="mb-3">
            <label for="rideId" class="form-label">Ride ID</label>
            <input type="number" class="form-control" id="rideId" name="rideId" placeholder="Enter Ride ID" required>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-primary">Track Ride</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
