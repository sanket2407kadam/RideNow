<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RideNow | Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Segoe UI',Tahoma,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#2563eb,#1e40af);
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Card */
.register-card{
  background:#fff;
  width:100%;
  max-width:420px;
  padding:40px;
  border-radius:18px;
  box-shadow:0 20px 40px rgba(0,0,0,.25);
  animation:slideUp .9s ease;
}

/* Animation */
@keyframes slideUp{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:translateY(0)}
}

/* Branding */
.logo{
  font-size:1.9em;
  font-weight:800;
  color:#2563eb;
  margin-bottom:5px;
}
.subtitle{
  font-size:.95em;
  color:#666;
  margin-bottom:25px;
}

/* Inputs */
.form-control,.form-select{
  border-radius:10px;
  padding:12px;
}
.form-control:focus,.form-select:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 .2rem rgba(37,99,235,.25);
}

/* Button */
.btn-register{
  background:#2563eb;
  color:#fff;
  border-radius:10px;
  font-weight:600;
  padding:12px;
  transition:.3s;
}
.btn-register:hover{
  background:#1e4fd8;
  transform:translateY(-2px);
  box-shadow:0 10px 20px rgba(37,99,235,.4);
}

/* Links */
.extra-links a{
  color:#2563eb;
  font-weight:600;
  text-decoration:none;
}
.extra-links a:hover{text-decoration:underline}
</style>
</head>

<body>

<div class="register-card text-center">

  <div class="logo">🚘 RideNow</div>
  <div class="subtitle">Create your account to get started</div>

  <form action="RegisterServlet" method="post">

    <div class="mb-3 text-start">
      <label class="form-label fw-semibold">Full Name</label>
      <input type="text" name="fullname" class="form-control" placeholder="Enter full name" required>
    </div>

    <div class="mb-3 text-start">
      <label class="form-label fw-semibold">Email</label>
      <input type="email" name="email" class="form-control" placeholder="Enter email" required>
    </div>

    <div class="mb-3 text-start">
      <label class="form-label fw-semibold">Phone Number</label>
      <input type="text" name="phone" class="form-control" placeholder="Enter phone number" required>
    </div>

    <div class="mb-3 text-start">
      <label class="form-label fw-semibold">Password</label>
      <input type="password" name="password" class="form-control" placeholder="Create password" required>
    </div>

    <div class="mb-3 text-start">
      <label class="form-label fw-semibold">Register As</label>
      <select name="role" class="form-select" required>
        <option value="">Select Role</option>
        <option value="rider">Rider</option>
        <option value="driver">Driver</option>
      </select>
    </div>

    <button type="submit" class="btn btn-register w-100">Create Account</button>
  </form>

  <div class="extra-links mt-4">
    <p class="mb-0">Already have an account? <a href="login.html">Login</a></p>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
