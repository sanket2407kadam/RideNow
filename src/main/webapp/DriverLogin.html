<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RideNow | Driver Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',Tahoma,sans-serif;
  background:#f4f6f8;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.login-card{
  background:#fff;
  padding:40px;
  border-radius:12px;
  box-shadow:0 15px 35px rgba(0,0,0,.2);
  width:100%;
  max-width:400px;
  text-align:center;
}
.login-card h2{
  color:#2563eb;
  margin-bottom:25px;
}
.form-control{
  margin-bottom:20px;
  padding:12px;
}
.btn-primary{
  width:100%;
  padding:12px;
  font-weight:600;
}
</style>
</head>
<body>

<div class="login-card">
  <h2>Driver Login</h2>
  <form action="DriverLoginServlet" method="post">
    <input type="number" name="driver_id" placeholder="Enter Driver ID" class="form-control" required>
    <button type="submit" class="btn btn-primary">Login</button>
  </form>
  <p class="mt-3"><a href="DriverRegister.html">New Driver? Register here</a></p>
   <a href="driverprofile">View My Profile</a>

  
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
