<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RideNow | Driver Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  font-family:'Segoe UI',Tahoma,sans-serif;
  background: linear-gradient(135deg, #e0f0ff, #f4f6f8);
  color:#333;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.registration-card {
  background:#fff;
  padding:40px 30px;
  border-radius:18px;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
  text-align:center;
  animation:fadeUp 1s ease;
  width:100%;
  max-width:400px;
}

@keyframes fadeUp {
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

.registration-card h2 {
  color:#2563eb;
  margin-bottom:25px;
  font-weight:800;
}

.registration-card input,
.registration-card select {
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:1em;
  transition:.3s;
}

.registration-card input:focus,
.registration-card select:focus {
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.2);
  outline:none;
}

.registration-card button {
  width:100%;
  padding:14px;
  background:#2563eb;
  color:#fff;
  font-weight:600;
  border:none;
  border-radius:10px;
  font-size:1em;
  cursor:pointer;
  transition:.3s;
}

.registration-card button:hover {
  background:#1e4fd8;
  transform:translateY(-2px);
  box-shadow:0 10px 20px rgba(37,99,235,.4);
}
</style>
</head>

<body>

<div class="registration-card">
  <h2>Driver Registration</h2>
  <form action="DriverRegisterServlet" method="post">
    <input type="text" name="vehicle_number" placeholder="Vehicle Number" required>
    <input type="text" name="vehicle_type" placeholder="Vehicle Type" required>
    <select name="availability">
      <option value="available" selected>Available</option>
      <option value="busy">Busy</option>
    </select>
    <button type="submit">Register Driver</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
