<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RideNow | Success</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>
body{
  font-family:'Segoe UI', Tahoma, sans-serif;
  background: linear-gradient(135deg,#dcfce7,#f0fdf4);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

/* Success Box */
.box{
  max-width:450px;
  width:100%;
  background:#fff;
  padding:40px 30px;
  border-radius:20px;
  box-shadow:0 25px 50px rgba(0,0,0,.15);
  text-align:center;
  animation:fadeUp 0.8s ease;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

/* Animated Check Icon */
.icon{
  font-size:70px;
  color:#16a34a;
  margin-bottom:20px;
  animation:pop 0.5s ease;
}

@keyframes pop{
  0%{transform:scale(0)}
  60%{transform:scale(1.2)}
  100%{transform:scale(1)}
}

/* Heading */
h2{
  color:#16a34a;
  font-weight:800;
  margin-bottom:15px;
}

/* Ride Details */
.ride-details{
  background:#f0fdf4;
  padding:15px 20px;
  border-radius:12px;
  margin-bottom:20px;
  text-align:left;
  font-size:.95em;
  color:#333;
  line-height:1.6;
}
.ride-details strong{color:#2563eb;}

/* Button */
button{
  padding:12px 26px;
  border:none;
  border-radius:12px;
  background: linear-gradient(135deg,#2563eb,#1e40af);
  color:#fff;
  font-weight:700;
  font-size:1em;
  transition: all 0.3s ease;
}
button:hover{
  background: linear-gradient(135deg,#1e40af,#2563eb);
  transform: translateY(-3px);
  box-shadow:0 10px 25px rgba(37,99,235,.4);
}
</style>
</head>

<body>

<div class="box">
  <div class="icon"><i class="fa-solid fa-circle-check"></i></div>
  <h2>Ride Confirmed!</h2>

  <div class="ride-details">
    <p><strong>Pickup:</strong> <span id="pickup">Mumbai</span></p>
    <p><strong>Drop:</strong> <span id="drop">Thane</span></p>
    <p><strong>Date & Time:</strong> <span id="rideDate">24 Dec 2025, 10:30 AM</span></p>
    <p><strong>Fare:</strong> ₹<span id="fare">350</span></p>
    <p><strong>Payment Status:</strong> <span class="text-success fw-bold">Successful</span></p>
  </div>

  <p class="text-muted mb-3">
    A confirmation email has been sent to your registered email.
  </p>

  <button onclick="window.location.href='rider-dashboard.jsp'">
    <i class="fa-solid fa-arrow-rotate-left"></i> Book Another Ride
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
</body>
</html>
