<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RideNow | Driver Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f6f8;color:#333}

/* NAVBAR */
.navbar{
  display:flex;justify-content:space-between;align-items:center;
  background:#fff;padding:14px 40px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.logo{font-size:1.6em;font-weight:800;color:#2563eb;}
nav a{
  margin-left:22px;color:#555;text-decoration:none;
  font-weight:600;font-size:.95em;
}
nav a:hover{color:#2563eb}

/* DASHBOARD */
.dashboard-section{
  min-height:calc(100vh - 70px);
  display:flex;justify-content:center;
  padding:40px;
}
.dashboard-card{
  background:#fff;width:100%;max-width:1000px;
  padding:38px;border-radius:16px;
  box-shadow:0 18px 35px rgba(0,0,0,.15);
}
.dashboard-card h2{
  color:#2563eb;font-weight:800;margin-bottom:6px;
}
.dashboard-card p{color:#666;margin-bottom:28px;}

/* Earnings */
.earnings-card{
  background:#2563eb;color:#fff;
  padding:18px;border-radius:12px;
  margin-bottom:25px;
  text-align:center;
  font-size:1.25em;
  font-weight:700;
}

/* Buttons */
.action-btn{
  width:100%;padding:13px;margin-bottom:18px;
  border:none;border-radius:10px;
  font-size:.95em;font-weight:600;
  color:#fff;background:#2563eb;
  transition:.3s;
}
.action-btn:hover{
  background:#1e4fd8;
  transform:translateY(-2px);
  box-shadow:0 8px 18px rgba(37,99,235,.4);
}

/* Table */
table{width:100%;border-collapse:collapse;margin-top:14px;}
th, td{padding:12px;border-bottom:1px solid #ddd;}
th{background:#2563eb;color:#fff;}
tr:hover{background:#f1f1f1;}
.table-responsive{overflow-x:auto}

/* Badges */
.badge-success{background:#28a745}
.badge-danger{background:#dc3545}
.badge-warning{background:#ffc107;color:#333}
</style>
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo">🚘 RideNow</div>
  <nav>
    <a href="LogoutServlet">Logout</a>
  </nav>
</header>

<!-- DASHBOARD -->
<section class="dashboard-section">
  <div class="dashboard-card">

    <h2>Driver Dashboard</h2>
    <p>Manage your rides, availability and earnings</p>

    <!-- Earnings -->
    <div id="totalEarnings" class="earnings-card">
      💰 Total Earnings: ₹0.00
    </div>

    <!-- Availability -->
    <form id="availabilityForm">
      <select id="availabilitySelect" class="form-select mb-2">
        <option value="available">Available</option>
        <option value="busy">Busy</option>
      </select>
      <button class="action-btn">🔄 Update Availability</button>
    </form>

    <!-- Assigned Rides -->
    <h4 class="mt-4">🚕 Assigned Rides</h4>
    <div id="ridesTable" class="table-responsive">Loading...</div>

    <!-- Payments -->
    <h4 class="mt-4">💳 Payment History</h4>
    <div id="paymentTable" class="table-responsive">Loading...</div>

  </div>
</section>

<script>
// Earnings
async function fetchEarnings(){
  const res = await fetch("DriverEarningsServlet");
  const total = await res.text();
  document.getElementById("totalEarnings").innerHTML =
    `💰 Total Earnings: ₹${Number(total || 0).toFixed(2)}`;
}

// Assigned rides
async function fetchRides(){
  const res = await fetch("ViewAssignedRidesServlet");
  const html = await res.text();
  document.getElementById("ridesTable").innerHTML = html;

  document.querySelectorAll("#ridesTable td[data-status]").forEach(td=>{
    const s = td.dataset.status;
    let c = "badge-warning";
    if(s==="accepted" || s==="completed") c="badge-success";
    if(s==="cancelled") c="badge-danger";
    td.innerHTML = `<span class="badge ${c}">${s}</span>`;
  });
}

// Payments
async function fetchPayments(){
  const res = await fetch("ViewPaymentsServlet");
  const html = await res.text();
  document.getElementById("paymentTable").innerHTML = html;

  document.querySelectorAll("#paymentTable td[data-status]").forEach(td=>{
    const s = td.dataset.status;
    const c = s==="SUCCESS" ? "badge-success" : "badge-danger";
    td.innerHTML = `<span class="badge ${c}">${s}</span>`;
  });
}

// COMPLETE RIDE (AUTO PAYMENT)
async function completeRide(rideId){
  if(!confirm("Mark ride as completed?")) return;

  const f = new FormData();
  f.append("ride_id", rideId);

  const res = await fetch("CompleteRideServlet", {
    method: "POST",
    body: f
  });

  alert(await res.text());
  fetchEarnings();
  fetchPayments();
  fetchRides();
}

// Availability update
document.getElementById("availabilityForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const f = new FormData();
  f.append("availability",
    document.getElementById("availabilitySelect").value);

  const res = await fetch("UpdateAvailabilityServlet",{method:"POST",body:f});
  alert(await res.text());
  fetchRides();
});

// Auto load
window.onload = ()=>{
  fetchEarnings();
  fetchRides();
  fetchPayments();
  setInterval(()=>{
    fetchEarnings();
    fetchRides();
    fetchPayments();
  },60000);
};
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
