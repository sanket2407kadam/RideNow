<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RideNow | Forgot Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#2563eb,#1e40af);
  font-family:'Segoe UI',Tahoma,sans-serif;
}
.card-box{
  background:#fff;
  padding:35px;
  border-radius:18px;
  width:100%;
  max-width:400px;
  box-shadow:0 20px 40px rgba(0,0,0,.25);
}
.logo{
  font-size:1.8rem;
  font-weight:800;
  color:#2563eb;
}
.btn-reset{
  background:#2563eb;
  color:#fff;
  border-radius:10px;
  font-weight:600;
}
.btn-reset:hover{
  background:#1e4fd8;
}
.msg{
  padding:10px;
  border-radius:8px;
  font-size:.9rem;
  margin-bottom:15px;
  display:none;
}
.msg-success{background:#dcfce7;color:#166534;}
.msg-error{background:#fee2e2;color:#991b1b;}
</style>
</head>

<body>

<div class="card-box text-center">
  <div class="logo">🚘 RideNow</div>
  <p class="text-muted mb-4">Reset your password</p>

  <div id="successMsg" class="msg msg-success">
    Password updated successfully
  </div>
  <div id="errorMsg" class="msg msg-error">
    Email not found
  </div>

  <form action="ForgotPasswordServlet" method="post">
    <div class="mb-3 text-start">
      <label class="form-label fw-semibold">Email</label>
      <input type="email" name="email" class="form-control" required>
    </div>

    <div class="mb-3 text-start">
      <label class="form-label fw-semibold">New Password</label>
      <input type="password" name="password" class="form-control" required>
    </div>

    <button class="btn btn-reset w-100">Reset Password</button>
  </form>

  <div class="mt-3">
    <a href="login.html" class="fw-semibold">Back to Login</a>
  </div>
</div>

<script>
const params=new URLSearchParams(window.location.search);
if(params.get("success")==="1"){
  document.getElementById("successMsg").style.display="block";
}
if(params.get("error")==="1"){
  document.getElementById("errorMsg").style.display="block";
}
</script>

</body>
</html>
