<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RideNow | Error</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  font-family:'Segoe UI', Tahoma, sans-serif;
  background: linear-gradient(135deg,#fee2e2,#fef2f2);
}
.box{
  max-width:420px;
  margin:100px auto;
  background:#fff;
  padding:35px;
  border-radius:18px;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
  text-align:center;
}
h2{
  color:#dc2626;
  font-weight:800;
}
.icon{
  font-size:60px;
  margin-bottom:15px;
}
button{
  margin-top:20px;
  padding:12px 22px;
  border:none;
  border-radius:10px;
  background:#dc2626;
  color:#fff;
  font-weight:700;
}
button:hover{
  background:#b91c1c;
}
</style>
</head>

<body>

<div class="box">
  <div class="icon">❌</div>
  <h2>Something Went Wrong</h2>
  <p class="text-muted">
    Payment failed or server error occurred.<br>
    Please try again.
  </p>

  <button onclick="history.back()">
    Go Back
  </button>
</div>

</body>
</html>
